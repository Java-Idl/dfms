name: dfms-ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-secure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@0b93645e9fb717ef62dd06161405e31704e6c38b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install --only-binary :all: -r requirements-dev.txt

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@7739552140a33190e37cb1025537e2ab7a81050e # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Static security analysis (Bandit)
        run: bandit -r app/command_service.py app/main.py -ll

      - name: Dependency audit
        run: pip-audit -r requirements-dev.txt || true

      - name: Unit, integration and system tests
        run: pytest -q --cov=app.command_service --cov-fail-under=85

      - name: Fuzz test
        run: python fuzz/fuzz_validation.py

      - name: Build container image
        run: docker build -t dfms:${{ github.sha }} .

      - name: Image vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: dfms:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Validate Kubernetes manifests
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary k8s/

  package:
    needs: build-test-secure
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (tagged by commit SHA)
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ${IMAGE_NAME}:${{ github.sha }} .
          docker push ${IMAGE_NAME}:${{ github.sha }}
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf6581a12fe429860cab # v4.4.3
        with:
          name: k8s-manifests
          path: k8s/
